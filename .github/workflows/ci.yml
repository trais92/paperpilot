name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint und Format
        run: |
          ruff check .
          ruff format --check .
      - name: Typprüfung (mypy --strict)
        run: mypy
      - name: Tests mit Abdeckung (mindestens 85 %)
        run: pytest -q --cov=paperpilot_ops --cov-fail-under=85
      - name: Demo-Lauf
        run: paperpilot demo
      - name: Evaluation (Mindestgenauigkeit 85 %)
        run: paperpilot eval --min-accuracy 0.85
