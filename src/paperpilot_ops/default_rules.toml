# Konfiguration für PaperPilot
# Alles, was das System entscheidet, steht hier und nicht im Code.
#
# - Die KI ordnet jede Mail einer Kategorie zu. Dafür liest sie `description`.
# - Die Stichwörter (`keywords`, `senders`) dienen dem Vorfilter: Was sie sicher als Werbung
#   erkennen, geht gar nicht erst an die KI. Außerdem sind sie der Vergleichswert in `paperpilot eval`.
#   Stichwörter werden kleingeschrieben verglichen, Treffer im Betreff zählen doppelt.
# - `enabled = false` an einer Kategorie oder Gruppe: wird erkannt, aber nicht abgelegt.
# - Jeder Zielordner bekommt eine Übersichtstabelle ("Übersicht") im festen Teil des Pfads,
#   z. B. "06 Rechnungen & Belege/Übersicht.csv".

[ai]
# Anbieter, der zuerst gefragt wird: "groq" (kostenlos, voreingestellt)
# oder "claude" (eigener, kostenpflichtiger Schlüssel).
provider = "groq"
# Reserve, falls der erste Anbieter nicht antwortet oder sein Kontingent erschöpft ist,
# z. B. ["claude"]. Anbieter ohne gespeicherten Schlüssel werden übersprungen.
fallback = []
# Ist sich die KI weniger sicher als dieser Wert, landet die Mail im Eingang zur Prüfung.
min_confidence = 0.6
# Optional ein anderes Modell je Anbieter:
# [ai.models]
# groq = "openai/gpt-oss-20b"

[general]
# Ordner fuer die Ablage (z. B. ein per Google Drive for Desktop synchronisierter Ordner)
target_dir = "ablage"
# Unter diesem Score landet eine Mail in "00 Eingang" zur menschlichen Pruefung
min_score = 2.0
# Melden nur, wenn eine Handlung noetig ist ("Signal statt Rauschen")
notify_on = [
  "bewerbung/einladung",
  "bewerbung/rueckfrage",
  "bewerbung/angebot",
  "bewerbung/absage",
]
# Ordner fuer unklare Mails (Human-in-the-loop)
review_folder = "00 Eingang"
# Tracker fuer Bewerbungen (Bruecke zu anderen Tools/Agenten)
tracker = "Bewerbungen/tracker.csv"
# Generische Absender-Domains: hier wird der Anzeigename statt der Domain genutzt
generic_domains = ["gmail.com", "gmx.de", "web.de", "outlook.com", "icloud.com", "example.com"]

# ---------------------------------------------------------------------------
# Werbung: wird nie abgelegt
[[categories]]
label = "werbung"
description = "Newsletter, Rabattaktionen, Werbung und automatische Job-Empfehlungen von Portalen."
action = "ignore"
keywords = [
  "newsletter", "abmelden", "abbestellen", "unsubscribe", "rabatt", "% auf",
  "nur heute", "jetzt sichern", "gutschein", "job-alert", "jobs für dich",
  "neue jobs", "passende stellen", "empfehlungen für dich", "angebot der woche",
]
senders = ["newsletter", "marketing", "jobalert", "no-reply@jobs", "news@"]

# ---------------------------------------------------------------------------
# Bewerbungen: erst muss die Gruppe passen, dann entscheidet der Untertyp
[groups.bewerbung]
keywords = [
  "ihre bewerbung", "deine bewerbung", "bewerbung als", "bewerbung für",
  "bewerbungsprozess", "ihre unterlagen", "deine unterlagen", "auswahlprozess",
  "position als", "stelle als", "vorstellungsgespräch", "recruiting",
]
folder = "Bewerbungen/{company}"

[[categories]]
label = "bewerbung/eingangsbestaetigung"
description = "Bestätigung, dass eine selbst eingereichte Bewerbung eingegangen ist."
group = "bewerbung"
keywords = ["eingegangen", "erhalten", "vielen dank für ihre bewerbung", "danke für deine bewerbung", "eingangsbestätigung", "melden uns"]

[[categories]]
label = "bewerbung/einladung"
description = "Einladung zu einem Gespräch, Interview oder Kennenlernen zu einer Bewerbung."
group = "bewerbung"
keywords = ["einladung", "einladen", "kennenlernen", "interview", "gespräch am", "termin", "video-call", "vorstellungsgespräch"]

[[categories]]
label = "bewerbung/rueckfrage"
description = "Rückfrage zu einer Bewerbung, z. B. nach Unterlagen, Gehalt oder Verfügbarkeit."
group = "bewerbung"
keywords = ["rückfrage", "frage zu", "könnten sie uns", "kannst du uns", "bitte senden sie", "nachreichen", "gehaltsvorstellung", "verfügbarkeit"]

[[categories]]
label = "bewerbung/absage"
description = "Absage auf eine Bewerbung."
group = "bewerbung"
keywords = ["leider", "absage", "nicht berücksichtigen", "anderen kandidaten", "entschieden", "viel erfolg für ihre", "nicht weiter"]

[[categories]]
label = "bewerbung/angebot"
description = "Vertrags- oder Stellenangebot nach einer Bewerbung."
group = "bewerbung"
keywords = ["angebot", "vertragsangebot", "arbeitsvertrag", "freuen uns, ihnen", "zusage", "willkommen im team"]

# ---------------------------------------------------------------------------
# Private Verwaltung
[[categories]]
label = "privat/rechnungen"
description = "Rechnungen, Belege, Quittungen und Bestellbestätigungen mit Betrag."
folder = "06 Rechnungen & Belege/{year}"
keywords = ["rechnung", "rechnungsnummer", "rechnungsbetrag", "zahlungsziel", "beleg", "quittung", "bestellbestätigung"]

[[categories]]
label = "privat/versicherungen"
description = "Post der eigenen Versicherungen: Police, Beitrag, Schadenfall."
folder = "05 Versicherungen"
keywords = ["versicherung", "police", "versicherungsschein", "beitragsanpassung", "schadenfall", "versicherungsnummer"]

[[categories]]
label = "privat/vertraege"
description = "Verträge mit Anbietern (Strom, Telefon, Abos): Bestätigung, Tarif, Kündigung."
folder = "04 Verträge"
keywords = ["vertrag", "vertragsbestätigung", "kündigung", "laufzeit", "tarif", "tarifwechsel", "widerruf"]

[[categories]]
label = "privat/steuern"
description = "Post vom Finanzamt und alles zur Steuererklärung."
folder = "03 Steuern/{year}"
keywords = ["finanzamt", "steuerbescheid", "elster", "einkommensteuer", "steuererklärung", "lohnsteuerbescheinigung"]

[[categories]]
label = "privat/wohnen"
description = "Miete, Nebenkosten, Vermieter, Hausverwaltung, Zählerstände."
folder = "09 Wohnen"
keywords = ["miete", "nebenkosten", "vermieter", "hausverwaltung", "wohnung", "zählerstand", "abschlag"]

[[categories]]
label = "privat/finanzen"
description = "Bank und Geldanlage: Kontoauszüge, Depot, Kreditkarte, Überweisungen."
folder = "02 Finanzen"
keywords = ["kontoauszug", "depot", "girokonto", "kreditkarte", "überweisung", "sparplan", "kontostand"]
